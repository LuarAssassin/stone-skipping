<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水体重做 · 同次投掷对照</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111b20;color:#e2e9eb}body{margin:0 auto;max-width:1600px;padding:24px}h1{font-size:25px;margin-bottom:8px}p{line-height:1.65;color:#b1c4ca}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:22px 0}select,a{background:#22343e;color:#e2e9eb;border:1px solid #47606a;border-radius:7px;padding:10px;text-decoration:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#182930;border:1px solid #314b56;border-radius:10px;overflow:hidden}figcaption{padding:12px;font-weight:650}img{display:block;width:100%;height:auto}small{display:block;line-height:1.6;color:#a6bdc4;margin:12px 0}@media(max-width:760px){body{padding:14px}.pair{grid-template-columns:1fr}}
</style></head><body><h1>水体重做 · 同一次投掷的前后对照</h1><p>固定 seed 271、温度 0，石头物理与初始条件不变。这里展示真实预览截图，不是概念效果图。对照用于审阅改进与残留问题，不代表已通过真实水体质量验收。</p><nav><label>阶段 <select id="stage"><option value="contact">触水 · 0.27075 秒</option><option value="exit" selected>离水 · 0.320 秒</option><option value="falling">水滴回落 · 0.480 秒</option><option value="propagation">波纹传播 · 0.950 秒</option></select></label><label>机位 <select id="view"><option value="bullet" selected>子弹时间近景 · 同机位</option><option value="close">跟随近景 · 同机位</option><option value="normal">各版本默认岸后机位</option></select></label><a href="/" target="_blank" rel="noopener">打开实时试玩</a></nav><small id="note"></small><div class="pair"><figure><figcaption>重做前</figcaption><img id="before" alt="同次投掷的旧版水体截图"></figure><figure><figcaption>重做后 · 当前待审阅版本</figcaption><img id="after" alt="同次投掷的新版水体截图"></figure></div><p>已改：实际高度场传播、接触路径扰动、回落涟漪、连续水舌与场景反射透射。仍需打磨：残余薄膜边缘、珠粒轮廓、远段石头和波纹可读性。</p><script>const stage=document.querySelector('#stage'),view=document.querySelector('#view');function update(){for(const version of ['before','after'])document.querySelector('#'+version).src=version+'-'+stage.value+'-'+view.value+'.png';document.querySelector('#note').textContent=view.value==='normal'?'注意：默认机位也已收近，因此本组同时包含镜头差异；判断水体形态请优先选同机位的近景。':'两版使用相同快照、物理时刻与机位，可直接比较水片、颗粒和波纹。'}stage.addEventListener('change',update);view.addEventListener('change',update);update();</script></body></html>
